services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d product_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongo-data:/data/db

  metrics:
    build: .
    profiles:
      - tools
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: product_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: product_benchmark
      EXPORT_DIR: ./exports/raw
      LOG_LEVEL: INFO
      POSTGRES_POOL_MIN: 1
      POSTGRES_POOL_MAX: 20
      MONGO_MAX_POOL_SIZE: 50
      BENCHMARK_DEFAULT_DATASET: small
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres-data:
  mongo-data:
