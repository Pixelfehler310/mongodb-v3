services:
  mongodb:
    image: mongo:7
    container_name: mongodb-demo
    restart: unless-stopped
    ports:
      - "27117:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongodb_demo_data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_demo
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d product_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data

  seed-mongo:
    build: .
    container_name: mongodb-demo-seed-mongo
    environment:
      DB_ENGINE: mongo
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: product_demo
      MONGO_COLLECTION: products
    command: ["python", "scripts/seed.py"]
    depends_on:
      mongodb:
        condition: service_healthy

  seed-postgres:
    build: .
    container_name: mongodb-demo-seed-postgres
    environment:
      DB_ENGINE: postgres
      POSTGRES_DSN: postgresql://benchmark:benchmark@postgres:5432/product_demo
    command: ["python", "scripts/seed.py"]
    depends_on:
      postgres:
        condition: service_healthy

  backend-mongo:
    build: .
    container_name: mongodb-demo-backend-mongo
    restart: unless-stopped
    environment:
      DB_ENGINE: mongo
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: product_demo
      MONGO_COLLECTION: products
      DEFAULT_LIMIT: 12
    ports:
      - "5000:5000"
    depends_on:
      seed-mongo:
        condition: service_completed_successfully

  backend-postgres:
    build: .
    container_name: mongodb-demo-backend-postgres
    restart: unless-stopped
    environment:
      DB_ENGINE: postgres
      PORT: 5000
      POSTGRES_DSN: postgresql://benchmark:benchmark@postgres:5432/product_demo
      DEFAULT_LIMIT: 12
    ports:
      - "5001:5000"
    depends_on:
      seed-postgres:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: mongodb-demo-frontend
    restart: unless-stopped
    environment:
      VITE_MONGO_API_PROXY_TARGET: http://backend-mongo:5000
      VITE_POSTGRES_API_PROXY_TARGET: http://backend-postgres:5000
    ports:
      - "3000:3000"
    depends_on:
      backend-mongo:
        condition: service_started
      backend-postgres:
        condition: service_started

volumes:
  mongodb_demo_data:
  postgres_demo_data:
